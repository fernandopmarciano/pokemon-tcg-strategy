<svg xmlns="http://www.w3.org/2000/svg" width="700" height="516" viewBox="0 0 700 516" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="700" height="516" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1a1a1a"></text>
<g transform="translate(0,-36)">
<text x="16" y="56" font-size="9.5" fill="#6b6b6b" letter-spacing="1">INPUTS</text>
<rect x="16" y="62" width="668" height="46" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<text x="30.0" y="82" font-size="10.5" font-weight="600" fill="#1a1a1a">state and legal actions</text>
<text x="30.0" y="96" font-size="9.5" fill="#6b6b6b">from the engine</text>
<line x1="183.0" y1="70" x2="183.0" y2="100" stroke="#d0d0d0" stroke-width="1"/>
<text x="197.0" y="82" font-size="10.5" font-weight="600" fill="#1a1a1a">own deck</text>
<text x="197.0" y="96" font-size="9.5" fill="#6b6b6b">60 cards</text>
<line x1="350.0" y1="70" x2="350.0" y2="100" stroke="#d0d0d0" stroke-width="1"/>
<text x="364.0" y="82" font-size="10.5" font-weight="600" fill="#1a1a1a">official catalogue</text>
<text x="364.0" y="96" font-size="9.5" fill="#6b6b6b">1,004 cards, 1,555 attacks</text>
<line x1="517.0" y1="70" x2="517.0" y2="100" stroke="#d0d0d0" stroke-width="1"/>
<text x="531.0" y="82" font-size="10.5" font-weight="600" fill="#1a1a1a">trained model</text>
<text x="531.0" y="96" font-size="9.5" fill="#6b6b6b">50 weights, mean and s.d.</text>
<line x1="350.0" y1="108" x2="350.0" y2="137" stroke="#6b6b6b" stroke-width="1"/>
<path d="M 346.5 132 L 350.0 138 L 353.5 132" fill="none" stroke="#6b6b6b" stroke-width="1"/>
<rect x="210" y="138" width="280" height="34" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<text x="350.0" y="159.0" font-size="11.5" fill="#1a1a1a" text-anchor="middle">first call of the container?</text>
<line x1="490" y1="155.0" x2="498" y2="155.0" stroke="#4a4a4a" stroke-width="1"/>
<path d="M 492 151.5 L 498 155.0 L 492 158.5" fill="none" stroke="#4a4a4a" stroke-width="1"/>
<text x="506" y="153.0" font-size="11.5" font-weight="600" fill="#1a1a1a">returns the 60</text>
<text x="506" y="168.0" font-size="11.5" font-weight="600" fill="#1a1a1a">deck card IDs</text>
<text x="506" y="140.0" font-size="9.5" fill="#6b6b6b">yes</text>
<line x1="350.0" y1="172" x2="350.0" y2="205" stroke="#6b6b6b" stroke-width="1"/>
<path d="M 346.5 200 L 350.0 206 L 353.5 200" fill="none" stroke="#6b6b6b" stroke-width="1"/>
<text x="338.0" y="193.0" font-size="10" fill="#6b6b6b" text-anchor="end">no</text>
<rect x="210" y="206" width="280" height="94" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<rect x="210" y="206" width="3" height="94" fill="#1a7f4b"/>
<text x="226" y="228.0" font-size="13" font-weight="600" fill="#6b6b6b">1</text>
<text x="250" y="228.0" font-size="12" font-weight="600" fill="#1a1a1a">one-turn search</text>
<text x="250" y="245.0" font-size="9.5" font-weight="400" fill="#6b6b6b">determinizes the hidden information:</text>
<text x="250" y="259.5" font-size="9.5" font-weight="400" fill="#6b6b6b">his list sampled by measured field use</text>
<text x="250" y="274.0" font-size="9.5" font-weight="400" fill="#6b6b6b">simulates each action to end of turn</text>
<text x="250" y="288.5" font-size="9.5" font-weight="400" fill="#6b6b6b">evaluates the resulting state</text>
<rect x="210" y="336" width="280" height="46" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<text x="226" y="355.8" font-size="13" font-weight="600" fill="#6b6b6b">2</text>
<text x="250" y="355.8" font-size="12" font-weight="600" fill="#1a1a1a">heuristic ordering</text>
<text x="250" y="372.8" font-size="9.5" font-weight="400" fill="#6b6b6b">chooses by action type</text>
<rect x="210" y="418" width="280" height="46" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<text x="226" y="437.8" font-size="13" font-weight="600" fill="#6b6b6b">3</text>
<text x="250" y="437.8" font-size="12" font-weight="600" fill="#1a1a1a">minimal selection</text>
<text x="250" y="454.8" font-size="9.5" font-weight="400" fill="#6b6b6b">chooses the first legal action</text>
<line x1="350.0" y1="300" x2="350.0" y2="335" stroke="#6b6b6b" stroke-width="1"/>
<path d="M 346.5 330 L 350.0 336 L 353.5 330" fill="none" stroke="#6b6b6b" stroke-width="1"/>
<text x="338.0" y="322.0" font-size="10" fill="#6b6b6b" text-anchor="end">time budget exhausted</text>
<line x1="350.0" y1="382" x2="350.0" y2="417" stroke="#6b6b6b" stroke-width="1"/>
<path d="M 346.5 412 L 350.0 418 L 353.5 412" fill="none" stroke="#6b6b6b" stroke-width="1"/>
<text x="338.0" y="404.0" font-size="10" fill="#6b6b6b" text-anchor="end">exception in the previous layer</text>
<rect x="510" y="206" width="174" height="94" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<text x="524" y="228.0" font-size="12" font-weight="600" fill="#1a1a1a">state evaluation</text>
<text x="524" y="245.0" font-size="9.5" font-weight="400" fill="#6b6b6b">hand-written terms:</text>
<text x="524" y="259.5" font-size="9.5" font-weight="400" fill="#6b6b6b">prizes, knockouts, energy</text>
<text x="524" y="274.0" font-size="9.5" font-weight="400" fill="#6b6b6b">+ linear model, 50</text>
<text x="524" y="288.5" font-size="9.5" font-weight="400" fill="#6b6b6b">variables, z = (x − μ) / σ</text>
<line x1="490" y1="253.0" x2="509" y2="253.0" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M 503 249.5 L 510 253.0 L 503 256.5" fill="none" stroke="#d0d0d0" stroke-width="1"/>
<line x1="178" y1="253.0" x2="178" y2="509.0" stroke="#1a7f4b" stroke-width="1"/>
<line x1="210" y1="253.0" x2="178" y2="253.0" stroke="#1a7f4b" stroke-width="1"/>
<circle cx="178" cy="253.0" r="2.5" fill="#1a7f4b"/>
<line x1="210" y1="359.0" x2="178" y2="359.0" stroke="#1a7f4b" stroke-width="1"/>
<circle cx="178" cy="359.0" r="2.5" fill="#1a7f4b"/>
<line x1="210" y1="441.0" x2="178" y2="441.0" stroke="#1a7f4b" stroke-width="1"/>
<circle cx="178" cy="441.0" r="2.5" fill="#1a7f4b"/>
<line x1="178" y1="509.0" x2="209" y2="509.0" stroke="#1a7f4b" stroke-width="1"/>
<path d="M 203 505.5 L 210 509.0 L 203 512.5" fill="none" stroke="#1a7f4b" stroke-width="1"/>
<rect x="210" y="486" width="280" height="46" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
<text x="224" y="505.8" font-size="12" font-weight="600" fill="#1a1a1a" font-family="Consolas,monospace">select_indices</text>
<text x="224" y="522.8" font-size="9.5" font-weight="400" fill="#6b6b6b">ranks by score, applies minCount and maxCount</text>
<line x1="490" y1="509.0" x2="498" y2="509.0" stroke="#1a7f4b" stroke-width="1"/>
<path d="M 492 505.5 L 498 509.0 L 492 512.5" fill="none" stroke="#1a7f4b" stroke-width="1"/>
<text x="506" y="507.0" font-size="11.5" font-weight="600" fill="#1a1a1a">legal selection</text>
<text x="506" y="522.0" font-size="11.5" font-weight="600" fill="#1a1a1a">of indices</text>
</g>
</svg>
